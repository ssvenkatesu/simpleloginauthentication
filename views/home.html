<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Authentication System</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="auth-header">
            <h1>🎉 Welcome!</h1>
            <p>You have successfully logged in to your account</p>
        </div>
        
        <div class="dashboard-content">
            <div class="welcome-card">
                <h2>Dashboard</h2>
                <p>This is your secure dashboard. You can access all your account features from here.</p>
                
                <div class="user-info">
                    <h3>Account Information</h3>
                    <p><strong>Status:</strong> <span class="status-active">Active</span></p>
                    <p><strong>Login Time:</strong> <span id="login-time"></span></p>
                </div>
            </div>
            
            <div class="action-buttons">
                <a href="/logout" class="logout-btn">
                    <span>🚪 Sign Out</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Display current time
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString();
            document.getElementById('login-time').textContent = timeString;
        }
        
        updateTime();
        setInterval(updateTime, 1000);

        // Add some interactive effects
        document.querySelector('.logout-btn').addEventListener('click', function(e) {
            this.innerHTML = '<span class="loading"></span> Signing Out...';
        });

        // Add welcome animation
        setTimeout(() => {
            document.querySelector('.welcome-card').style.transform = 'scale(1.02)';
            setTimeout(() => {
                document.querySelector('.welcome-card').style.transform = 'scale(1)';
            }, 200);
        }, 500);
    </script>
</body>
</html>
